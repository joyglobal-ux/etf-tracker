name: Daily ETF Tracker

on:
  schedule:
    # 한국시간 매일 18:30 (UTC 09:30) — 평일만
    - cron: "30 9 * * 1-5"
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF tracker
        run: python kosdaq_etf_tracker.py

      - name: Commit and push (with retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ kosdaq_etf_report.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily ETF snapshot $(date -u +%Y-%m-%d)"

          # 최대 5회 재시도: pull --rebase로 동시 push 대응 + 서버 일시오류 재시도
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push attempt $i failed, syncing and retrying..."
            sleep $((i * 10))
            git pull --rebase -X theirs origin main || true
          done
          echo "Push failed after 5 attempts"
          exit 1
